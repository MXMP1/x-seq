<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111318" />
<title>x-sequence — секвенсор</title>
<style>
  :root {
    --bg: #111318; --card: #1b1e26; --line: #2a2f3a; --text: #e8eaf0; --dim: #8a93a6;
    --accent: #4f9cf9; --on: #3ddc84; --beat: #232838; --err: #ff7b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; }
  body { padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); max-width: 780px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chips { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { font-size: 11px; color: var(--dim); background: var(--card); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
  .chip.live { color: var(--on); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0; }
  .row label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 6px; }
  button { font: inherit; color: var(--text); background: #252a36; border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; min-height: 44px; touch-action: manipulation; }
  button:active { background: #2f3646; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #08111f; font-weight: 600; }
  button.danger { background: #b63a2c; border-color: #b63a2c; color: #fff; font-weight: 600; }
  button:disabled { opacity: .45; }
  input[type="number"] { width: 76px; font: inherit; color: inherit; background: #12151c;
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  select { font: inherit; color: inherit; background: #12151c; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px; max-width: 60vw; }
  input[type="range"] { accent-color: var(--accent); width: 120px; }
  input[type="checkbox"] { accent-color: var(--accent); width: 18px; height: 18px; }
  .hint { color: var(--dim); font-size: 12px; }
  .err { color: var(--err); }

  /* Piano roll сетка */
  .grid-wrap { overflow-x: auto; padding-bottom: 4px; }
  .grid { position: relative; display: grid; grid-template-columns: 52px repeat(16, 34px);
    gap: 3px; width: max-content; }
  .gnum { height: 22px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: var(--dim); }
  .gnum.beat { color: var(--text); font-weight: 600; }
  .glabel { height: 34px; display: flex; align-items: center; font-size: 12px; color: var(--dim);
    position: sticky; left: 0; background: var(--card); z-index: 2; }
  .cell { height: 34px; border-radius: 6px; background: #12151c; border: 1px solid var(--line);
    touch-action: manipulation; }
  .cell.beat { background: var(--beat); }
  .cell.on { background: var(--on); border-color: var(--on); box-shadow: 0 0 8px rgba(61, 220, 132, .45); }
  .cell.active-col { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cell.active-col.on { outline-color: #fff; }
  #debug { margin: 0; white-space: pre-wrap; word-break: break-word; font-size: 11.5px; }
</style>
</head>
<body>

<header>
  <h1>x-sequence</h1>
  <div class="chips">
    <span class="chip" id="chip-audio">аудио: —</span>
    <span class="chip" id="chip-midi">MIDI: нет</span>
  </div>
</header>

<section>
  <div class="row">
    <button id="btn-play" class="primary">▶ Запустить</button>
    <label>BPM <input id="bpm" type="number" min="40" max="240" step="1" value="120" /></label>
  </div>
  <div class="row">
    <label>Луп <select id="loop-file"></select></label>
    <label>Громкость <input id="loop-vol" type="range" min="0" max="1" step="0.01" value="1" /></label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="follow" checked /> Следить за позицией</label>
  </div>
  <div class="row hint" id="audio-status"></div>
</section>

<section>
  <div class="row">
    <button id="btn-midi">Подключить MIDI (USB-C)</button>
    <select id="midi-out" hidden></select>
    <button id="btn-test-note" disabled>Тест-нота</button>
  </div>
  <div class="row">
    <label>Смещение MIDI <input id="midi-offset" type="range" min="-50" max="50" step="1" value="25" />
      <span class="hint" id="midi-offset-val">+25 мс</span></label>
  </div>
  <div class="row hint" id="midi-status">MIDI не подключён. Подключите FM-1 кабелем USB-C и нажмите
    кнопку (Chrome 152+ на Android, страница должна быть открыта по http://localhost).</div>
  <div class="row hint">
    <label><input type="checkbox" id="use-ts" /> экспериментально: timestamp в MIDIOutput.send()</label>
  </div>
</section>

<section>
  <div class="row hint">Тап по клетке — включить/выключить ноту. 16 шагов = 1 такт (4/4, шаг 1/16),
    строки — ноты для FM-1.</div>
  <div class="grid-wrap" id="grid-wrap"><div class="grid" id="grid"></div></div>
</section>

<section>
  <pre class="hint" id="debug"></pre>
</section>

<script type="module">
import { SequencerEngine, WebMidiBackend } from './engine.js';

/* ============================ Конфигурация ============================ */

// Лупы из library/loops. BPM в имени файла (techno_128bpm.mp3) сообщает, под какой
// темп луп записан — движок сам посчитает число тактов и подгонит playbackRate,
// чтобы луп всегда ложился ровно на такт. Добавили файл — впишите строкой сюда.
const LOOP_FILES = [
  'library/loops/techno_128bpm.mp3',
  'library/loops/techno2_128bpm.mp3',
  'library/loops/dnb_160bpm.mp3',
];

const engine = new SequencerEngine({ bpm: 120 });

/* ============================ DOM-хелперы ============================ */

const $ = (id) => document.getElementById(id);
const btnPlay = $('btn-play'), bpmIn = $('bpm'), loopSel = $('loop-file'), volIn = $('loop-vol');
const followCb = $('follow'), audioStatus = $('audio-status');
const btnMidi = $('btn-midi'), midiOutSel = $('midi-out'), btnTest = $('btn-test-note');
const offIn = $('midi-offset'), offVal = $('midi-offset-val'), midiStatus = $('midi-status'), tsCb = $('use-ts');
const gridWrap = $('grid-wrap'), grid = $('grid'), dbg = $('debug');
const chipAudio = $('chip-audio'), chipMidi = $('chip-midi');

/* ============================ Сборка сетки ============================ */

for (const url of LOOP_FILES) {
  const o = document.createElement('option');
  o.value = url;
  o.textContent = url.split('/').pop();
  loopSel.appendChild(o);
}

const cols = engine.steps;
const cellEls = []; // [row][step] → DOM-элемент
const colEls = Array.from({ length: cols }, () => []); // [step] → все элементы столбца

{
  const corner = document.createElement('div');
  grid.appendChild(corner);
  for (let s = 0; s < cols; s++) {
    const n = document.createElement('div');
    n.className = 'gnum' + (s % 4 === 0 ? ' beat' : '');
    n.textContent = String(s + 1);
    grid.appendChild(n);
    colEls[s].push(n);
  }
  engine.rows.forEach((row, r) => {
    const lab = document.createElement('div');
    lab.className = 'glabel';
    lab.textContent = row.label;
    lab.title = `MIDI note ${row.note}`;
    grid.appendChild(lab);
    cellEls[r] = [];
    for (let s = 0; s < cols; s++) {
      const c = document.createElement('div');
      c.className = 'cell' + (s % 4 === 0 ? ' beat' : '');
      c.dataset.row = String(r);
      c.dataset.step = String(s);
      grid.appendChild(c);
      cellEls[r][s] = c;
      colEls[s].push(c);
    }
  });
  // pointerdown — отзывчивее, чем click, на телефоне
  grid.addEventListener('pointerdown', (e) => {
    const t = e.target;
    if (!t.classList?.contains('cell')) return;
    const vel = engine.toggleCell(Number(t.dataset.row), Number(t.dataset.step));
    t.classList.toggle('on', vel > 0);
  }, { passive: true });
}

/* ============================ Подсветка шага ============================ */

let activeCol = -1;

function highlight(step) {
  if (activeCol === step) return;
  if (activeCol >= 0) for (const el of colEls[activeCol]) el.classList.remove('active-col');
  activeCol = step;
  for (const el of colEls[step]) el.classList.add('active-col');
  if (followCb.checked) {
    const cell = cellEls[0][step];
    gridWrap.scrollTo({
      left: Math.max(0, cell.offsetLeft - gridWrap.clientWidth / 2 + cell.offsetWidth / 2),
      behavior: 'auto',
    });
  }
}

function clearHighlight() {
  if (activeCol < 0) return;
  for (const el of colEls[activeCol]) el.classList.remove('active-col');
  activeCol = -1;
}

// Движок сам зовёт колбэки: подсветка синхронизирована с аудио-часами (rAF).
engine.onStepTrigger = (step) => highlight(step);
engine.onTransportStop = () => { clearHighlight(); updatePlayBtn(); releaseWakeLock(); };

/* ============================ Транспорт ============================ */

function updatePlayBtn() {
  const on = engine.isPlaying;
  btnPlay.textContent = on ? '■ Стоп' : '▶ Запустить';
  btnPlay.classList.toggle('danger', on);
  btnPlay.classList.toggle('primary', !on);
}

// Wake Lock: не даём экрану уснуть, пока играем (иначе браузер троттлит таймеры).
let wakeSentinel = null;
async function acquireWakeLock() {
  try {
    wakeSentinel = (await navigator.wakeLock?.request('screen')) ?? null;
    wakeSentinel?.addEventListener?.('release', () => { wakeSentinel = null; });
  } catch { /* не критично */ }
}
function releaseWakeLock() {
  try { wakeSentinel?.release(); } catch { /* уже отпущен */ }
  wakeSentinel = null;
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && engine.isPlaying) {
    engine.audioContext?.resume?.().catch(() => {});
    acquireWakeLock();
  }
});

btnPlay.addEventListener('click', async () => {
  if (engine.isPlaying) { engine.stop(); return; }
  btnPlay.disabled = true;
  const prevLabel = btnPlay.textContent;
  btnPlay.textContent = '… готовлю звук';
  audioStatus.classList.remove('err');
  audioStatus.textContent = 'загружаю луп…';
  try {
    await engine.initAudio(); // создаёт/будит AudioContext — тут нужен жест пользователя
    await engine.loadLoopFromUrl(loopSel.value);
    engine.start();
    updatePlayBtn();
    acquireWakeLock();
    const d = engine.getDebugInfo();
    audioStatus.textContent = d.loop.loaded
      ? `луп: ${d.loop.fileName} — ${d.loop.durationSec.toFixed(2)} с ≈ ${d.loop.bars} такт(ов) @ ${d.loop.sourceBpm ?? '?'} BPM, играю ×${d.loop.effectiveRate.toFixed(3)}`
      : '';
  } catch (e) {
    audioStatus.textContent = 'ошибка: ' + e.message;
    audioStatus.classList.add('err');
  } finally {
    btnPlay.disabled = false;
    if (!engine.isPlaying) btnPlay.textContent = prevLabel;
  }
});

bpmIn.addEventListener('change', () => {
  engine.setBpm(Number(bpmIn.value));
  bpmIn.value = String(engine.bpm); // показываем зажатое значение (40..240)
});
volIn.addEventListener('input', () => engine.setLoopVolume(Number(volIn.value)));
loopSel.addEventListener('change', async () => {
  if (!engine.audioContext) return; // загрузится при Play
  try {
    await engine.loadLoopFromUrl(loopSel.value); // подхватится на следующем такте
    const d = engine.getDebugInfo();
    audioStatus.textContent = `луп: ${d.loop.fileName} ≈ ${d.loop.bars} такт(ов), ×${d.loop.effectiveRate.toFixed(3)}`;
  } catch (e) {
    audioStatus.textContent = 'ошибка: ' + e.message;
    audioStatus.classList.add('err');
  }
});

// Пробел — play/stop на десктопе
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) {
    e.preventDefault();
    btnPlay.click();
  }
});

/* ============================ MIDI ============================ */

btnMidi.addEventListener('click', async () => {
  midiStatus.classList.remove('err');
  if (!WebMidiBackend.isSupported()) {
    midiStatus.textContent = 'Web MIDI недоступен: нужен Chrome 152+ и открытие по http://localhost';
    midiStatus.classList.add('err');
    return;
  }
  midiStatus.textContent = 'запрашиваю доступ к MIDI…';
  try {
    const backend = await WebMidiBackend.connect(); // под требуемый user gesture
    engine.midi.connect(backend);
    renderPorts(backend);
    backend.access.addEventListener?.('statechange', () => renderPorts(backend));
    btnTest.disabled = false;
    midiStatus.textContent = `MIDI подключён: «${backend.name}»`;
    chipMidi.textContent = 'MIDI: ' + backend.name;
    chipMidi.classList.add('live');
  } catch (e) {
    midiStatus.textContent = 'MIDI: ' + e.message;
    midiStatus.classList.add('err');
  }
});

function renderPorts(backend) {
  const ports = backend.listPorts();
  if (!ports.length) { midiOutSel.hidden = true; return; }
  midiOutSel.innerHTML = '';
  for (const p of ports) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name;
    midiOutSel.appendChild(o);
  }
  midiOutSel.value = backend.output.id;
  midiOutSel.hidden = false;
}

midiOutSel.addEventListener('change', () => {
  const out = engine.selectMidiPort(midiOutSel.value);
  if (out) {
    midiStatus.textContent = `MIDI подключён: «${out.name}»`;
    chipMidi.textContent = 'MIDI: ' + out.name;
  }
});

// Тест-нота: короткое арпеджио по всем строкам сетки — проверить, что FM-1 отвечает
btnTest.addEventListener('click', () => {
  engine.rows.forEach((r, i) => {
    setTimeout(() => engine.midi.sendImmediate([0x90, r.note, 100]), i * 150);
    setTimeout(() => engine.midi.sendImmediate([0x80, r.note, 0]), i * 150 + 120);
  });
});

const renderOffset = () => {
  const v = Number(offIn.value);
  engine.setMidiOffset(v);
  offVal.textContent = (v > 0 ? '+' : '') + Math.round(v) + ' мс';
};
offIn.addEventListener('input', renderOffset);
renderOffset();

tsCb.addEventListener('change', () => { engine.midi.useTimestamp = tsCb.checked; });

/* ============================ Дебаг-панель ============================ */

setInterval(() => {
  const d = engine.getDebugInfo();
  const ctxInfo = d.ctx
    ? `${d.ctx.state}, ${(d.ctx.sampleRate / 1000).toFixed(1)} кГц, base ${d.ctx.baseLatencyMs?.toFixed(1) ?? '—'} мс, output ${d.ctx.outputLatencyMs?.toFixed(1) ?? '—'} мс`
    : 'нет контекста (нажмите Play)';
  chipAudio.textContent = 'аудио: ' + (d.ctx ? d.ctx.state : '—');
  chipAudio.classList.toggle('live', d.ctx?.state === 'running');

  dbg.textContent =
    `шаг: ${d.isPlaying ? (d.absStep - 1) % d.steps + 1 : '—'} | тиков шедулера: ${d.ticks} | визуальных в очереди: ${d.scheduledUiEvents}\n` +
    `MIDI: ${d.midi.connected ? d.midi.backendName : 'нет'} — отправлено ${d.midi.sentCount}, в таймерах ${d.midi.pendingSends}, звучит нот ${d.midi.soundingNotes.length}, смещение ${d.midi.offsetMs} мс${d.midi.useTimestamp ? ', timestamp: вкл' : ''}\n` +
    `луп: ${d.loop.loaded ? `${d.loop.fileName} — ${d.loop.durationSec.toFixed(3)} с, ${d.loop.bars} такт(ов) @ ${d.loop.sourceBpm ?? '?'} BPM, играю ×${d.loop.effectiveRate.toFixed(3)}` : 'не загружен'}\n` +
    `аудио: ${ctxInfo} | lookahead ${d.lookaheadMs.toFixed(0)} мс | BPM ${d.bpm}`;
}, 300);

updatePlayBtn();
console.log('x-sequence: интерфейс готов. Нажмите «Запустить» (жест нужен для AudioContext).');
</script>
</body>
</html>
